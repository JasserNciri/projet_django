<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer {{ expedition.reference }}</title>
</head>
<body>
    <h1>Supprimer l'expédition {{ expedition.reference }} ?</h1>
    <p>{{ expedition.ville_depart }} → {{ expedition.ville_arrivee }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Oui, supprimer</button>
        <a href="{% url 'expedition:list' %}">Annuler</a>
    </form>
</body>
</html>
