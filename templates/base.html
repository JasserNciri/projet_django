<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expéditions{% endblock %}</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #172e6e;
            --primary-light: #eef2fb;
            --danger: #b91c1c;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f5f7fa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }
        header { background: var(--primary); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        header a { color: #fff; text-decoration: none; }
        header a:hover { text-decoration: none; }
        header .brand { font-weight: 600; font-size: 17px; }
        header nav { display: flex; gap: 4px; flex-wrap: wrap; }
        header nav a { padding: 6px 12px; border-radius: 4px; font-size: 14px; color: rgba(255, 255, 255, .8); }
        header nav a:hover { background: rgba(255, 255, 255, .1); color: #fff; }
        header nav a.active { background: rgba(255, 255, 255, .18); color: #fff; font-weight: 500; }
        @media (max-width: 640px) { header { padding: 12px 16px; } main { padding: 0 16px; } }
        main { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 24px; color: var(--primary); }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--primary); font-weight: 600; background: var(--primary-light); }
        tr:hover td { background: #fafbfd; }
        .link-danger { color: var(--danger); }
        .card { background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--primary); padding: 24px; }
        dl { display: grid; grid-template-columns: 180px 1fr; gap: 12px 16px; margin: 0; }
        dt { color: var(--muted); }
        dd { margin: 0; font-weight: 500; }
        .actions { margin-top: 24px; display: flex; gap: 12px; align-items: center; }
        .btn {
            display: inline-block; padding: 8px 16px; border: 1px solid var(--primary); border-radius: 4px;
            background: #fff; color: var(--primary); font: inherit; text-decoration: none; cursor: pointer;
        }
        .btn:hover { background: var(--primary-light); text-decoration: none; }
        .page-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .page-header h1 { margin: 0; }
        .btn-primary { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: #fff; font-weight: 500; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
        .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-danger:hover { background: #991b1b; }
        .btn-outline-danger { border-color: var(--danger); color: var(--danger); }
        .btn-outline-danger:hover { background: #fef2f2; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--primary-light); color: var(--primary); }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .action {
            display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
            border: 1px solid var(--border); border-radius: 4px; background: #fff;
            font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s;
        }
        .action:hover { text-decoration: none; }
        .action svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .action-view { color: var(--muted); }
        .action-view:hover { color: var(--text); border-color: #cbd5e1; background: #f8fafc; }
        .action-edit { color: var(--primary); border-color: #c7d2ee; }
        .action-edit:hover { background: var(--primary-light); border-color: var(--primary); }
        .action-delete { color: var(--danger); border-color: #f3c4c4; }
        .action-delete:hover { background: #fef2f2; border-color: var(--danger); }
        .form-card { padding: 28px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field.full { grid-column: 1 / -1; }
        .form-field label { font-size: 13px; font-weight: 600; color: var(--text); }
        .form-field .required { color: var(--danger); }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%; padding: 9px 12px; font: inherit; color: var(--text);
            background: #fff; border: 1px solid #d1d5db; border-radius: 4px;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-field textarea { min-height: 110px; resize: vertical; }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 58, 138, .15);
        }
        .form-field.has-error input, .form-field.has-error select, .form-field.has-error textarea { border-color: var(--danger); }
        .field-error { color: var(--danger); font-size: 13px; }
        .form-alert { background: #fef2f2; border: 1px solid #f3c4c4; color: var(--danger); padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; }
        .form-alert p { margin: 0; }
        .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-muted { background: #f3f4f6; color: var(--muted); }
        .form-field.checkbox { flex-direction: row-reverse; justify-content: flex-end; align-items: center; gap: 10px; }
        .form-field.checkbox input { width: 18px; height: 18px; accent-color: var(--primary); }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="{% url 'expedition:list' %}">Gestion des expéditions</a>
        <nav>
            {% with ns=request.resolver_match.namespace %}
            <a href="{% url 'expedition:list' %}"{% if ns == 'expedition' %} class="active"{% endif %}>Expéditions</a>
            <a href="{% url 'offre:offre_list' %}"{% if ns == 'offre' %} class="active"{% endif %}>Offres</a>
            <a href="{% url 'vehicule:vehicule_list' %}"{% if ns == 'vehicule' %} class="active"{% endif %}>Véhicules</a>
            <a href="{% url 'entreprise:entreprise_list' %}"{% if ns == 'entreprise' %} class="active"{% endif %}>Entreprises</a>
            {% endwith %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
